plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':common')
}

application {
    mainClass = 'co.edu.icesi.sitmmio.worker.WorkerMain'
}

jar {
    manifest {
        attributes 'Main-Class': 'co.edu.icesi.sitmmio.worker.WorkerMain'
    }
    dependsOn ':common:jar'
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
