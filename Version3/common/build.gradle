plugins {
    id 'java-library'
    id 'com.zeroc.gradle.ice-builder.slice' version '1.5.0'
}

repositories {
    mavenCentral()
}

dependencies {
    api 'com.zeroc:ice:3.7.9'
}

def configuredIceHome = findProperty('iceHome') ?: System.getenv('ICE_HOME')
if (configuredIceHome) {
    def iceHomeDir = file(configuredIceHome)
    if (iceHomeDir.name.equalsIgnoreCase('bin')) {
        iceHomeDir = iceHomeDir.parentFile
    }

    slice {
        iceHome = iceHomeDir
    }
}

// El plugin busca automáticamente en src/main/slice
// y genera el código en build/generated-src/slice/java
