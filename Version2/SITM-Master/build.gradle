plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':SITM-Common')
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

application {
    mainClass = 'co.edu.icesi.sitmmio.datacenter.distributed.DistributedMasterMain'
}

tasks.register('runDistributedMaster', JavaExec) {
    group = 'application'
    description = 'Runs the distributed ICE master.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'co.edu.icesi.sitmmio.datacenter.distributed.DistributedMasterMain'
}
